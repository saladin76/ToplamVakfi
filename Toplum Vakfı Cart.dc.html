<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سلة التبرعات — وقف التضامن الاجتماعي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./toplum-inner.css" />
  <script src="./currency.js"></script>
  <style>
    .ct-cart { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
    .ct-items { padding: 10px 24px; min-height: 150px; }
    .ct-empty { padding: 30px 20px; text-align: center; }
    .ct-empty .in-script { display: block; font-size: 30px; margin-bottom: 6px; }
    .ct-empty b { display: block; color: var(--ink); font-size: 14px; font-weight: 800; margin-bottom: 18px; }
    .ct-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .ct-row:last-child { border-bottom: 0; }
    .ct-row h3 { margin: 0 0 8px; color: var(--ink); font-size: 15px; font-weight: 800; line-height: 1.5; }
    .ct-tag { display: inline-flex; align-items: center; min-height: 26px; padding: 0 12px; border-radius: 999px; background: #eef4f8; color: var(--muted); font-size: 12px; font-weight: 800; }
    .ct-tag.is-rec { background: #e6f4fb; color: var(--brand-ink); }
    .ct-end { display: flex; align-items: center; gap: 10px; }
    .ct-amt { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fbfdff; direction: ltr; }
    .ct-amt:focus-within { border-color: var(--brand); background: #fff; }
    .ct-amt span { color: var(--brand-ink); font-weight: 800; }
    .ct-amt input { width: 74px; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 15px; font-weight: 900; }
    .ct-del { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #fdf1ef; color: #b3261e; cursor: pointer; }
    .ct-del svg { width: 17px; height: 17px; }
    .ct-sum { position: sticky; top: 92px; padding: 24px; border-radius: 18px; color: #fff; background: linear-gradient(160deg, #04234a 0%, #082b50 55%, #031a36 100%); box-shadow: 0 16px 36px rgba(3,26,54,.28); }
    .ct-sum h2 { margin: 0 0 16px; font-size: 18px; font-weight: 900; }
    .ct-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; color: #cfe3f1; font-size: 13px; }
    .ct-line b { color: #fff; direction: ltr; }
    .ct-total { margin-top: 8px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.14); display: flex; justify-content: space-between; align-items: baseline; }
    .ct-total span { font-size: 17px; font-weight: 900; }
    .ct-total b { font-size: 22px; font-weight: 900; direction: ltr; }
    .ct-go { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 48px; margin-top: 18px; border-radius: 999px; background: linear-gradient(90deg, #1b6fe0 0%, #1ca3ec 72%, #27b8f2 100%); color: #fff; font-size: 14px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,162,224,.35); }
    .ct-go:hover { color: #fff; }
    .ct-go[aria-disabled="true"] { background: rgba(255,255,255,.12); color: rgba(255,255,255,.6); box-shadow: none; pointer-events: none; }
    .ct-more { display: flex; justify-content: center; align-items: center; min-height: 44px; margin-top: 8px; color: #cfe3f1; font-size: 13px; font-weight: 700; }
    .ct-more:hover { color: #fff; }
    .ct-safe { display: flex; align-items: center; gap: 7px; margin-top: 10px; color: #b9d3e6; font-size: 12px; }
    .ct-safe svg { width: 14px; height: 14px; }
    @media (max-width: 900px) { .ct-cart { grid-template-columns: 1fr; } .ct-sum { position: static; } }
    @media (max-width: 560px) { .ct-row { grid-template-columns: 1fr; } .ct-items { padding: 6px 16px; } }
    /* No banner on the cart: the content clears the fixed header directly
       (86px desktop, 66px phone) plus breathing room. */
    .ct-main { padding-top: 112px; }
    @media (max-width: 760px) { .ct-main { padding-top: 90px; } }
  </style>
</helmet>
<div dir="rtl">
  <dc-import name="Toplum Vakfı Header" active-key="" hint-size="100%,64px"></dc-import>

  <main class="in-main ct-main">
    <h1 class="in-wrap" style="margin:0 auto 18px;font-size:clamp(24px,3vw,32px);font-weight:900;color:var(--ink)">سلة التبرعات</h1>
    <div class="in-wrap ct-cart">
      <section class="in-card ct-items" aria-label="سلة التبرعات">
        <div id="ctList"></div>
        <div class="ct-empty" id="ctEmpty" hidden="hidden">
          <span class="in-script">دائرة الخير تكبر بكم</span>
          <b>سلة التبرعات فارغة</b>
          <a class="in-pill" href="Toplum Vakfı Programs.dc.html#open" style="padding:0 24px">تصفح المشاريع</a>
        </div>
      </section>

      <aside class="ct-sum" aria-label="ملخص التبرع">
        <h2>ملخص التبرع</h2>
        <div class="ct-line"><span>عدد التبرعات</span><b id="ctCount">0</b></div>
        <div class="ct-line" id="ctOnceRow"><span>لمرة واحدة</span><b id="ctOnce">$0</b></div>
        <div class="ct-line" id="ctMonthRow"><span>شهريًا</span><b id="ctMonth">$0</b></div>
        <div class="ct-total"><span>الإجمالي</span><b id="ctTotal">$0</b></div>
        <a class="ct-go" id="ctGo" href="Toplum Vakfı Payment Info.dc.html" aria-disabled="true">المتابعة للدفع</a>
        <a class="ct-more" href="Toplum Vakfı Programs.dc.html#open">متابعة التبرع لمشاريع أخرى</a>
        <p class="ct-safe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>دفع مشفّر وآمن</p>
      </aside>
    </div>
  </main>

  <dc-import name="Toplum Vakfı Footer" hint-size="100%,60px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const KEY = 'tv_cart';
const MONTHLY = 'تبرع شهري', ONCE = 'تبرع مرة واحدة';
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isMonthly = f => /شهري/.test(f || '');

class Component extends DCLogic {
  read() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  write(c) { localStorage.setItem(KEY, JSON.stringify(c)); }
  money(v) { return window.tvCurrency ? window.tvCurrency.format(v) : '$' + Math.round(v).toLocaleString('en-US'); }

  componentDidMount() {
    const list = document.getElementById('ctList');
    list.addEventListener('click', e => {
      const row = e.target.closest('.ct-row'); if (!row) return;
      const i = Number(row.dataset.i), cart = this.read();
      if (e.target.closest('.ct-del')) { cart.splice(i, 1); this.write(cart); this.render(); return; }
    });
    list.addEventListener('change', e => {
      const inp = e.target.closest('input'); if (!inp) return;
      const row = inp.closest('.ct-row'), cart = this.read(), i = Number(row.dataset.i);
      const n = Math.max(1, Math.round(Number(inp.value) || 0));
      cart[i].amount = n; this.write(cart); this.render();
    });
    window.addEventListener('tv:currency', () => this.render());
    this.render();
  }

  render() {
    const cart = this.read();
    const $ = id => document.getElementById(id);
    $('ctEmpty').hidden = cart.length > 0;
    $('ctList').innerHTML = cart.map((it, i) => {
      const m = isMonthly(it.freq), w = /أسبوع/.test(it.freq || '');
      const L = s => (window.tvI18n && window.tvI18n.t ? window.tvI18n.t(s) : s);
      // A fixed tag, not a toggle: frequency is chosen where the gift is set up.
      const tag = w ? 'أسبوعيًا' : m ? 'شهريًا' : 'مرة واحدة';
      return '<div class="ct-row" data-i="' + i + '"><div><h3>' + esc(it.name) + '</h3>' +
        '<span class="ct-tag' + (m || w ? ' is-rec' : '') + '">' + L(tag) + '</span></div>' +
        '<div class="ct-end"><label class="ct-amt" title="تعديل المبلغ"><span>$</span><input type="number" min="1" value="' + Number(it.amount) + '" aria-label="تعديل المبلغ"></label>' +
        '<button type="button" class="ct-del" aria-label="حذف">' + TRASH + '</button></div></div>';
    }).join('');
    const once = cart.filter(x => !isMonthly(x.freq)).reduce((a, x) => a + Number(x.amount || 0), 0);
    const month = cart.filter(x => isMonthly(x.freq)).reduce((a, x) => a + Number(x.amount || 0), 0);
    $('ctCount').textContent = cart.length;
    $('ctOnce').textContent = this.money(once);
    $('ctMonth').textContent = this.money(month);
    $('ctOnceRow').hidden = !once && month > 0;
    $('ctMonthRow').hidden = !month;
    $('ctTotal').textContent = this.money(once + month);
    $('ctGo').setAttribute('aria-disabled', cart.length ? 'false' : 'true');
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
