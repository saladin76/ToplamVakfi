<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #00a2e0; --brand-2: #00a1df; --ink: #062442; --muted: #5d7187; --page-bg: #f4f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page-bg); color: var(--ink); font-family: Cairo, Arial, sans-serif; }
    a, button { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    .container { width: min(860px, calc(100% - 48px)); margin: 0 auto; }
    .secure-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .secure-badge svg { width: 15px; height: 15px; color: var(--brand); }
    .steps { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 26px 0 12px; flex-wrap: wrap; }
    .steps-dots { display: flex; align-items: center; gap: 6px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 700; }
    .step-dot .circle { width: 24px; height: 24px; border-radius: 50%; background: #e9eff3; color: var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
    .step-dot.active .circle, .step-dot.done .circle { background: var(--brand); color: #fff; }
    .step-dot.active { color: var(--ink); }
    .step-sep { width: 24px; height: 1px; background: #dbe6ee; align-self: center; }
    .layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 26px; align-items: start; margin: 20px 0 60px; }
    .panel { background: #fff; border: 1px solid #e6eef3; border-radius: 18px; box-shadow: 0 16px 34px rgba(2,52,88,.08); padding: 34px; }
    .panel h2 { margin: 0 0 22px; font-size: 19px; font-weight: 800; }
    .cart-item { display: flex; gap: 14px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid #eef3f7; flex-wrap: wrap; }
    .cart-main { display: flex; gap: 14px; align-items: center; width: 100%; }
    .cart-freq { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-inline-start: 60px; }
    .cart-freq-tabs { display: flex; background: #eef3f7; border: 1px solid #e2eaf0; border-radius: 10px; padding: 3px; }
    .cart-freq-tabs button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
    .cart-freq-tabs button.active { background: #fff; color: var(--brand); box-shadow: 0 2px 6px rgba(2,52,88,.12); }
    .cart-amt-edit { position: relative; display: flex; align-items: center; gap: 4px; background: #f2f6f9; border: 1.5px solid #e2eaf0; border-radius: 10px; min-height: 44px; padding: 0 10px; direction: ltr; cursor: text; transition: border-color .2s, background .2s; }
    .cart-amt-edit:hover { border-color: rgba(0,162,224,.45); }
    .cart-amt-edit svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; transition: color .2s; }
    .cart-amt-edit:hover svg, .cart-amt-edit:focus-within svg { color: var(--brand-ink); }
    .cart-amt-edit:focus-within { border-color: var(--brand); background: #fff; }
    .cart-amt-edit span { color: var(--muted); font-size: 12px; font-weight: 800; }
    /* The wrapper's height does not propagate to the input, so the hit area is set here. */
    .cart-amt-edit input { width: 68px; min-width: 0; min-height: 42px; background: transparent; border: 0; outline: none; font-family: inherit; font-size: 13px; font-weight: 800; color: var(--ink); text-align: center; }
    @media (max-width: 560px) { .cart-freq { padding-inline-start: 0; } }
    .cart-item:last-child { border-bottom: 0; }
    .cart-icon { width: 46px; height: 46px; border-radius: 12px; background: #eaf6fd; color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
    .cart-icon svg { width: 22px; height: 22px; }
    .cart-item-body { flex: 1; min-width: 0; }
    .cart-item-body h3 { margin: 0 0 5px; font-size: 14px; line-height: 1.4; }
    .cart-item-body span { font-size: 12px; color: var(--muted); font-weight: 700; }
    .cart-item-amt { text-align: left; direction: ltr; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .cart-item-amt b { font-size: 16px; color: var(--brand); font-weight: 800; }
    .cart-remove { background: transparent; border: 0; color: #c0392b; font-size: 12px; cursor: pointer; font-weight: 700; min-height: 44px; padding: 0 4px; }
    .review-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eef3f7; font-size: 13.5px; }
    .review-row.total { font-weight: 800; font-size: 17px; border-bottom: 0; padding-top: 16px; }
    .review-row b { color: var(--ink); direction: ltr; }
    .review-row span:first-child { color: var(--muted); }
    .btn-primary { width: 100%; background: var(--brand); color: #fff; padding: 15px; border-radius: 999px; font-weight: 800; font-size: 15px; margin-top: 18px; border: 0; cursor: pointer; min-height: 48px; }
    .btn-primary:hover { background: var(--brand-2); }
    .btn-primary:disabled { opacity: .5; pointer-events: none; }
    .trust-strip { display: flex; justify-content: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
    .trust-strip span { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
    .trust-strip svg { width: 13px; height: 13px; color: var(--brand); }
    .continue-link { display: block; text-align: center; font-size: 12.5px; color: var(--brand); font-weight: 700; margin-top: 20px; min-height: 44px; line-height: 44px; }
    .empty { text-align: center; padding: 70px 20px; }
    .empty svg { width: 60px; height: 60px; color: #c7d6e0; margin-bottom: 16px; }
    .empty h2 { font-size: 17px; margin: 0 0 8px; }
    .empty p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
    .empty a { display: inline-flex; align-items: center; background: var(--brand); color: #fff; padding: 12px 26px; border-radius: 999px; font-weight: 800; font-size: 13.5px; min-height: 44px; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 480px) { .step-dot span:not(.circle) { display: none; } .step-sep { width: 14px; } .panel { padding: 22px; } }
  </style>
</helmet>
<div dir="rtl">
  <dc-import name="Toplum Vakfı Header" active-key="" hint-size="100%,78px"></dc-import>
  <div style="height:78px"></div>
  <div class="container">
    <div class="steps">
      <div class="steps-dots">
      <div class="step-dot active"><span class="circle">1</span><span>السلة</span></div>
      <div class="step-sep"></div>
      <div class="step-dot"><span class="circle">2</span><span>الدفع</span></div>
      <div class="step-sep"></div>
      <div class="step-dot"><span class="circle">3</span><span>التأكيد</span></div>
      </div>
      <div class="secure-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>تبرع آمن ومشفّر</span></div>
    </div>
    <div class="layout" id="cartLayout">
      <div class="panel"><h2>سلة التبرعات</h2><div id="itemsList"></div></div>
      <div class="panel" id="summaryBox">
        <h2>ملخص التبرع</h2>
        <div class="review-row"><span>عدد البنود</span><b id="sumCount">0</b></div>
        <div class="review-row total" id="sumOnceRow"><span>إجمالي لمرة واحدة</span><b id="sumTotal">$0</b></div>
        <div class="review-row total" id="sumMonthlyRow" style="display:none"><span>شهريًا</span><b id="sumMonthly">$0</b></div>
        <button class="btn-primary" type="button" id="checkoutBtn">إتمام التبرع ←</button>
        <div class="trust-strip"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>دفع آمن ومشفّر</span></div>
        <a class="continue-link" href="Toplum Vakfı Projects.dc.html">+ إضافة مشروع آخر</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this.render();
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      const cart = JSON.parse(localStorage.getItem('tv_cart') || '[]');
      if (!cart.length) return;
      window.location.href = 'Toplum Vakfı Payment Info.dc.html';
    });
  }
  render() {
    const cart = JSON.parse(localStorage.getItem('tv_cart') || '[]');
    const list = document.getElementById('itemsList');
    const layout = document.getElementById('cartLayout');
    const summaryBox = document.getElementById('summaryBox');
    if (!cart.length) {
      summaryBox.style.display = 'none';
      layout.style.gridTemplateColumns = '1fr';
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><h2>سلتك فارغة</h2><p>لم تُضِف أي مشروع للسلة بعد. تصفّح المشاريع وابدأ رحلة العطاء.</p><a href="Toplum Vakfı Projects.dc.html">تصفح المشاريع</a></div>';
      return;
    }
    const icons = ['<circle cx="12" cy="8" r="4"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/>', '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'];
    const money = (v) => (window.tvCurrency ? window.tvCurrency.format(Number(v)) : '$' + v);
    const symbol = () => (window.tvCurrency ? window.tvCurrency.symbol() : '$');
    // Amounts are stored in USD; the editable field shows the selected currency.
    const toLocal = (usd) => (window.tvCurrency ? window.tvCurrency.fromUsd(Number(usd)) : Number(usd));

    list.innerHTML = cart.map((item, i) => {
      const monthly = item.freq === 'تبرع شهري';
      return `
      <div class="cart-item">
        <div class="cart-main">
          <div class="cart-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${icons[i % 2]}</svg></div>
          <div class="cart-item-body"><h3>${item.name}</h3><span>${monthly ? 'يتكرر شهريًا' : 'تبرع مرة واحدة'}</span></div>
          <div class="cart-item-amt"><b>${money(item.amount)}${monthly ? ' / شهريًا' : ''}</b><button class="cart-remove" data-i="${i}" type="button">إزالة</button></div>
        </div>
        <div class="cart-freq">
          <div class="cart-freq-tabs">
            <button type="button" data-freq-i="${i}" data-freq="once" class="${monthly ? '' : 'active'}">مرة واحدة</button>
            <button type="button" data-freq-i="${i}" data-freq="monthly" class="${monthly ? 'active' : ''}">شهريًا</button>
          </div>
          <label class="cart-amt-edit" title="تعديل المبلغ"><span>${symbol()}</span><input type="number" min="1" data-amt-i="${i}" value="${toLocal(item.amount)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></label>
        </div>
      </div>`;
    }).join('');

    // Handlers re-read storage: persisting the closure's snapshot resurrected stale
    // rows written by a later render (currency change, remount).
    const patch = (i, fields) => {
      const c = JSON.parse(localStorage.getItem('tv_cart') || '[]');
      if (!c[i]) return;
      Object.assign(c[i], fields);
      localStorage.setItem('tv_cart', JSON.stringify(c));
      this.render();
    };
    list.querySelectorAll('[data-freq-i]').forEach(btn => btn.addEventListener('click', () => {
      patch(Number(btn.dataset.freqI), {
        freq: btn.dataset.freq === 'monthly' ? 'تبرع شهري' : 'تبرع مرة واحدة'
      });
    }));
    list.querySelectorAll('[data-amt-i]').forEach(input => {
      const commit = () => {
        const i = Number(input.dataset.amtI);
        const local = Number(input.value);
        if (!(local > 0)) {
          const c = JSON.parse(localStorage.getItem('tv_cart') || '[]');
          if (c[i]) input.value = toLocal(c[i].amount);
          return;
        }
        const usd = window.tvCurrency ? window.tvCurrency.toUsd(local) : local;
        patch(i, { amount: Math.round(usd * 100) / 100 });
      };
      input.addEventListener('change', commit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    });
    list.querySelectorAll('.cart-remove').forEach(btn => btn.addEventListener('click', () => {
      const cart2 = JSON.parse(localStorage.getItem('tv_cart') || '[]');
      cart2.splice(Number(btn.dataset.i), 1);
      localStorage.setItem('tv_cart', JSON.stringify(cart2));
      this.render();
    }));
    document.getElementById('sumCount').textContent = cart.length;
    // Recurring and one-time money are different promises — never one figure.
    const sum = (f) => cart.filter(f).reduce((s, it) => s + Number(it.amount), 0);
    const onceUsd = sum(it => it.freq !== 'تبرع شهري');
    const monthlyUsd = sum(it => it.freq === 'تبرع شهري');
    document.getElementById('sumTotal').textContent = money(onceUsd);
    document.getElementById('sumMonthly').textContent = money(monthlyUsd) + ' / شهريًا';
    document.getElementById('sumOnceRow').style.display = onceUsd > 0 || monthlyUsd === 0 ? 'flex' : 'none';
    document.getElementById('sumMonthlyRow').style.display = monthlyUsd > 0 ? 'flex' : 'none';
    if (!this._currBound) {
      this._currBound = true;
      window.addEventListener('tv:currency', () => this.componentDidMount());
    }
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
