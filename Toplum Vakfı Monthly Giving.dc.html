<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="120" fill="#062442"/>
    <circle cx="60" cy="60" r="27" fill="none" stroke="#00a2e0" stroke-width="5"/>
    <path d="M60 46v28M46 60h28" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </svg>
</template>

<helmet>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #00a2e0; --brand-ink: #0077b3; --brand-2: #00a1df; --ink: #062442; --navy: #031a31; --muted: #5d7187; --page-bg: #f4f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page-bg); color: var(--ink); font-family: Cairo, Arial, sans-serif; }
    a { text-decoration: none; color: inherit; }
    a:hover { color: var(--brand-ink); }
    button { font-family: inherit; }
    .container { width: min(1180px, calc(100% - 64px)); margin: 0 auto; }

    /* Hero holds both the sentence and the plan: the builder is the page's only
       action, so it sits in the first screen rather than below the fold. */
    .mg-hero { position: relative; display: grid; align-items: start; padding-top: calc(78px + var(--alert-h, 0px)); color: #fff; overflow: hidden; }
    .mg-hero-img { position: absolute; inset: 0; background: url('assets/hero-bg.jpg') center 32% / cover no-repeat; }
    .mg-hero-img::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(2,20,38,.94) 0%, rgba(2,20,38,.90) 45%, rgba(2,20,38,.86) 78%, rgba(2,20,38,.80) 100%); }
    .mg-hero-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 48px; align-items: start; padding: 42px 0 clamp(40px, 5vw, 64px); }
    .mg-hero-text { padding-top: 6px; }
    .mg-kicker { display: block; color: #9fdcf7; font-size: 17px; font-weight: 800; letter-spacing: 1.2px; margin-bottom: 16px; }
    /* One line: the sentence is short, and a break would split the hadith. */
    .mg-hero h1 { margin: 0; font-size: clamp(26px, 3.4vw, 44px); font-weight: 900; line-height: 1.24; letter-spacing: -1px; white-space: nowrap; }
    .mg-hero h1 em { font-style: normal; color: #4cc5f0; }
    .mg-source { margin: 18px 0 0; color: #b9d3e6; font-size: 13px; font-weight: 700; padding-inline-start: 14px; border-inline-start: 2px solid rgba(0,162,224,.6); }
    .mg-hero-lede { margin: 22px 0 0; color: #cfe3f2; font-size: 14px; line-height: 2; max-width: 46ch; }

    /* The builder sits inside the hero, so it drops its sticky behaviour. */
    .mg-rail { position: relative; }
    .mg-builder { background: #fff; border: 1px solid #e6eef3; border-radius: 18px; padding: 24px; box-shadow: 0 24px 60px rgba(2,20,38,.34); color: var(--ink); }
    .mg-builder h2 { margin: 0 0 18px; font-size: 16px; font-weight: 800; }
    /* Two cadences: weekly and monthly. */
    .mg-freq { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; background: #eef3f7; border: 1px solid #e2eaf0; border-radius: 11px; padding: 3px; margin-bottom: 16px; }
    .mg-freq button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-family: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
    .mg-freq button:hover { color: var(--ink); }
    .mg-freq button.active { background: #fff; color: var(--brand-ink); box-shadow: 0 2px 6px rgba(2,52,88,.12); }

    .mg-field { margin-bottom: 16px; }
    .mg-field > label { display: block; font-size: 12.5px; font-weight: 800; margin-bottom: 8px; }
    /* Amounts and the custom field share one row: five stacked blocks made the box
       twice the height of the text beside it. */
    .mg-amounts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
    .mg-amounts button { min-height: 46px; border: 1.5px solid #e2eaf0; border-radius: 10px; background: #f2f6f9; color: var(--ink); font-size: 13px; font-weight: 800; direction: ltr; cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .15s; }
    .mg-amounts button:hover { border-color: var(--brand); transform: translateY(-1px); }
    .mg-amounts button.active { background: linear-gradient(135deg, var(--brand), #0089cb); border-color: var(--brand); color: #fff; box-shadow: 0 8px 18px rgba(0,162,224,.34); }
    .mg-custom { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin-top: 0; background: #f2f6f9; border: 1.5px solid #e2eaf0; border-radius: 10px; padding: 0 14px; min-height: 46px; direction: ltr; transition: border-color .2s, background .2s; }
    .mg-custom:focus-within { border-color: var(--brand); background: #fff; }
    .mg-custom span { color: var(--muted); font-weight: 800; font-size: 13px; }
    .mg-custom input { flex: 1; min-width: 0; min-height: 44px; background: transparent; border: 0; outline: none; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink); text-align: left; }
    /* One select reading as a sentence beats three cramped buttons: bare numerals
       are cryptic, written-out ordinals wrap, and a list scales to any day. */
    .mg-days { position: relative; display: block; }
    .mg-days select { width: 100%; min-height: 48px; padding-inline-start: 44px; padding-inline-end: 14px; border: 1.5px solid #e2eaf0; border-radius: 10px; background: #f2f6f9; color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; appearance: none; transition: border-color .15s, background .15s; }
    .mg-days select:hover, .mg-days select:focus { border-color: var(--brand); background: #fff; outline: none; }
    /* Physical border sides for the glyph: under RTL `border-inline-start` resolves
       to the right edge, so the apex lands south-east and rotating −45° points the
       caret east. left+bottom gives a south-west apex → rotates to south. Placement
       stays logical so it follows the writing direction. */
    .mg-days::after { content: ""; position: absolute; top: 50%; inset-inline-start: 16px; width: 9px; height: 9px; margin-top: -6px; border-left: 2px solid var(--brand-ink); border-bottom: 2px solid var(--brand-ink); transform: rotate(-45deg); pointer-events: none; }

    /* One compact line: the amount leads, the rest reads as a sentence. */
    .mg-summary { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; background: #f7fbfd; border: 1px solid #e2ebf1; border-radius: 12px; padding: 13px 16px; margin-bottom: 16px; }
    .mg-summary b { color: var(--brand-ink); font-size: 20px; font-weight: 900; direction: ltr; }
    .mg-summary > span { color: var(--muted); font-size: 12.5px; font-weight: 700; line-height: 1.7; }
    .mg-summary em { font-style: normal; color: var(--ink); }

    .mg-cta { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; background: linear-gradient(135deg, var(--brand), #0089cb); color: #fff; border: 0; border-radius: 999px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px rgba(0,162,224,.34); transition: transform .2s, box-shadow .2s; }
    .mg-cta:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,162,224,.44); }
    .mg-fine { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.8; }

    @media (max-width: 980px) {
      .mg-hero-in { grid-template-columns: minmax(0,1fr); gap: 28px; padding-bottom: 34px; }
      .mg-hero h1 { white-space: normal; }
      .mg-hero-lede { max-width: none; }
      .mg-rail { position: static; }
    }
    @media (max-width: 620px) {
      .container { width: min(100% - 32px, 560px); }
      .mg-builder { padding: 20px 17px; }
      .mg-amounts { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .mg-days select { font-size: 13.5px; }
    }
  </style>
</helmet>

<div dir="rtl">
  <dc-import name="Toplum Vakfı Header" active-key="" hint-size="100%,78px"></dc-import>

  <section class="mg-hero">
    <div class="mg-hero-img" aria-hidden="true"></div>
    <div class="container mg-hero-in">
      <div class="mg-hero-text">
        <span class="mg-kicker">برنامج العطاء الدوري</span>
        <h1>ما نقص مالٌ <em>من صدقة</em></h1>
        <p class="mg-source">حديث شريف</p>
        <p class="mg-hero-lede">اشترك بمبلغ يناسبك، يتجدد تلقائيًا في الباب الذي تختاره.</p>
      </div>

      <aside class="mg-rail">
        <div class="mg-builder">
          <h2 id="mgBuilderTitle">صدقتك الشهرية</h2>

          <div class="mg-freq" id="mgFreq" role="group" aria-label="تكرار الصدقة">
            <button type="button" data-freq="weekly">أسبوعيًا</button>
            <button type="button" class="active" data-freq="monthly">شهريًا</button>
          </div>

          <div class="mg-field">
            <label id="mgAmtLabel">المبلغ الشهري</label>
            <div class="mg-amounts" id="mgAmounts" role="group" aria-labelledby="mgAmtLabel">
              <button type="button" class="active" data-amt="25">$25</button>
              <button type="button" data-amt="50">$50</button>
              <button type="button" data-amt="75">$75</button>
              <button type="button" data-amt="100">$100</button>
              <label class="mg-custom" data-no-currency>
                <span data-currency-symbol>$</span>
                <input id="mgCustom" type="number" min="5" placeholder="مبلغ آخر">
              </label>
            </div>
          </div>

          <div class="mg-field">
            <label for="mgFundSelect">الباب الذي تُصرف فيه</label>
            <div class="mg-days">
              <select id="mgFundSelect">
                <option value="رعاية الأيتام">رعاية الأيتام</option>
                <option value="التعليم">التعليم والمنح الدراسية</option>
                <option value="الإغاثة الإنسانية">الإغاثة الإنسانية</option>
                <option value="المياه النظيفة">المياه النظيفة والآبار</option>
                <option value="القرآن والقيم">القرآن والقيم</option>
                <option value="حيث الحاجة">حيث الحاجة الأشد</option>
              </select>
            </div>
          </div>

          <div class="mg-summary">
            <b id="mgSumAmt">$25</b>
            <span><em id="mgSumFreqWord">شهريًا</em> · <em id="mgSumFund">رعاية الأيتام</em> · <em>يبدأ فور الاشتراك</em></span>
          </div>

          <button class="mg-cta" type="button" id="mgStart">ابدأ صدقتك الشهرية</button>
          <p class="mg-fine" id="mgFine">يتجدد بالمبلغ نفسه حتى توقفه أنت · دفع آمن ومحمي</p>
        </div>
      </aside>
    </div>
  </section>

  <dc-import name="Toplum Vakfı Footer" hint-size="100%,60px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const fundSelect = document.getElementById('mgFundSelect');
    const amounts = [...document.querySelectorAll('#mgAmounts button')];
    const custom = document.getElementById('mgCustom');
    const sumAmt = document.getElementById('mgSumAmt');
    const sumFund = document.getElementById('mgSumFund');

    const freqBtns = [...document.querySelectorAll('#mgFreq button')];
    const amtLabel = document.getElementById('mgAmtLabel');
    const builderTitle = document.getElementById('mgBuilderTitle');
    const sumAmtLabel = document.getElementById('mgSumFreqWord');
    let freq = 'monthly';

    const cta = document.getElementById('mgStart');
    if (!cta || !amounts.length) return;

    let amount = 25;
    let fund = 'رعاية الأيتام';

    const money = (usd) => (window.tvCurrency ? window.tvCurrency.format(usd) : '$' + usd.toLocaleString('en-US'));
    // The first charge runs at signup, so there is no schedule to pick.
    const weekly = () => freq === 'weekly';
    const render = () => {
      sumAmt.textContent = money(amount);
      sumFund.textContent = fund;
      if (amtLabel) amtLabel.textContent = weekly() ? 'المبلغ الأسبوعي' : 'المبلغ الشهري';
      if (sumAmtLabel) sumAmtLabel.textContent = weekly() ? 'أسبوعيًا' : 'شهريًا';
      if (builderTitle) builderTitle.textContent = weekly() ? 'صدقتك الأسبوعية' : 'صدقتك الشهرية';
      cta.textContent = weekly() ? 'ابدأ صدقتك الأسبوعية' : 'ابدأ صدقتك الشهرية';
    };

    freqBtns.forEach(b => b.addEventListener('click', () => {
      freqBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      freq = b.dataset.freq;
      render();
    }));

    fundSelect.addEventListener('change', () => { fund = fundSelect.value; render(); });
    amounts.forEach(b => b.addEventListener('click', () => {
      amounts.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      amount = Number(b.dataset.amt);
      custom.value = '';
      render();
    }));
    custom.addEventListener('input', () => {
      const n = Number(custom.value);
      if (n > 0) { amounts.forEach(x => x.classList.remove('active')); amount = n; render(); }
    });
    window.addEventListener('tv:currency', render);

    cta.addEventListener('click', () => {
      const cart = JSON.parse(localStorage.getItem('tv_cart') || '[]');
      cart.push(weekly()
        ? { name: 'صدقة أسبوعية — ' + fund, amount, freq: 'تبرع أسبوعي' }
        : { name: 'صدقة شهرية — ' + fund, amount, freq: 'تبرع شهري' });
      localStorage.setItem('tv_cart', JSON.stringify(cart));
      window.location.href = 'Toplum Vakfı Cart.dc.html';
    });

    render();
  }
  renderVals() { return {}; }
}

</script>
</body>
</html>
