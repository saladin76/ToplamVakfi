<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #00a2e0; --brand-2: #00a1df; --ink: #062442; --muted: #5d7187; --page-bg: #f4f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page-bg); color: var(--ink); font-family: Cairo, Arial, sans-serif; }
    a { text-decoration: none; color: inherit; }
    .container { width: min(1180px, calc(100% - 64px)); margin: 0 auto; }
    .page-banner { background: linear-gradient(120deg, #021428 0%, #082b50 60%, #04172e 100%); padding: 108px 0 62px; color: #fff; position: relative; overflow: hidden; }
    .page-banner::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: radial-gradient(#fff 1px, transparent 1.5px); background-size: 34px 34px; }
    .page-banner-inner { position: relative; z-index: 1; }
    .page-banner h1 { margin: 0 0 10px; font-size: clamp(30px, 3.4vw, 44px); font-weight: 800; }
    .page-banner p { margin: 0; color: #b9d3e6; font-size: 14.5px; max-width: 620px; line-height: 1.8; }
    .board-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; padding: 64px 0 80px; }
    .board-card { background: #fff; border: 1px solid #e6eef3; border-radius: 16px; box-shadow: 0 12px 30px rgba(2,52,88,.06); padding: 30px 20px; text-align: center; }
    .board-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--page-bg); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 18px; margin: 0 auto 14px; }
    .board-card h3 { margin: 0 0 6px; font-size: 15px; }
    .board-card span { color: var(--muted); font-size: 12.5px; }
    @media (max-width: 760px) { .board-grid { grid-template-columns: 1fr; } }
  </style>

<div dir="rtl">
  <dc-import name="Toplum Vakfı Header" active-key="about" hint-size="100%,78px"></dc-import>
  <section class="page-banner">
    <div class="container page-banner-inner">
      <h1>مجلس الإدارة</h1>
      <p>القيادات المسؤولة عن رؤية الوقف ومساره الاستراتيجي.</p>
    </div>
  </section>
  <div class="container board-grid">
    <div class="board-card"><div class="board-avatar">أ.ح</div><h3>د. أحمد حمدي يلدرم</h3><span>رئيس الهيئة الاستشارية العليا</span></div>
    <div class="board-card"><div class="board-avatar">ح.أ</div><h3>د. حمدي أرسلان</h3><span>رئيس هيئة المتولين</span></div>
    <div class="board-card"><div class="board-avatar">ع.ك</div><h3>د. عبد الصمد كوتشاك</h3><span>رئيس مجلس الإدارة</span></div>
  </div>
  <dc-import name="Toplum Vakfı Footer" hint-size="100%,60px"></dc-import>
</div>
</x-dc>
</body>
</html>
